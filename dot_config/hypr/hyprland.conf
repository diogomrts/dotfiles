source=~/.config/hypr/macchiato.conf

################
### MONITORS ###
################

exec-once = xrandr --verbose --output "DP-1" --primary

monitor=HDMI-A-1,preferred,0x0,1
monitor=DP-1,highrr,-900x1080,1

# fallback monitor
monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = hyprpaper
exec-once = cliphist wipe; wl-paste --watch cliphist store
exec-once = ydotoold

# Workspace rules
windowrule = workspace 1, match:class zen-browser
windowrule = workspace 5, match:class steam
windowrule = workspace 10, match:class discord
windowrule = workspace 10, match:class vesktop

windowrule = monitor 1, match:class steam
windowrule = fullscreen 1, match:class ^steam_app_\\d+$
windowrule = monitor 1, match:class ^steam_app_\\d+$
windowrule = workspace 4, match:class ^steam_app_\\d+$
windowrule = match:class ^steam_app_960090$, tile 1
windowrule = fullscreen 0, match:class ^steam_app_960090$

windowrule = float 1, match:class ^(zen)$, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:class ^(zen)$, match:title ^(Picture-in-Picture)$

# RuneLite FIXED
windowrule = float 1, match:class ^(net-runelite-client-RuneLite)$, match:title ^(RuneLite)$
windowrule = size 1920 1080, match:class ^(net-runelite-client-RuneLite)$, match:title ^(RuneLite)$
windowrule = center 1, match:class ^(net-runelite-client-RuneLite)$, match:title ^(RuneLite)$

# Startup apps
exec-once = [workspace 1; monitor DP-1] zen-browser
#exec-once = [workspace 9 silent; monitor HDMI-A-1] zen-browser
exec-once = [workspace 1; monitor DP-1] sleep 5 && $terminal
exec-once = [workspace 5 silent; monitor DP-1] steam
exec-once = [workspace 10 silent; monitor HDMI-A-1] vesktop

exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Workspace → monitor mapping
exec-once = hyprctl dispatch moveworkspacetomonitor 1 1
exec-once = hyprctl dispatch moveworkspacetomonitor 2 1
exec-once = hyprctl dispatch moveworkspacetomonitor 3 1
exec-once = hyprctl dispatch moveworkspacetomonitor 4 1
exec-once = hyprctl dispatch moveworkspacetomonitor 5 1
exec-once = hyprctl dispatch moveworkspacetomonitor 6 1
exec-once = sleep 5 && hyprctl dispatch moveworkspacetomonitor 9 0
exec-once = sleep 5 && hyprctl dispatch moveworkspacetomonitor 10 0

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $blue $pink 45deg
    col.inactive_border = $mauve
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bindl = $mainMod, G, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media player keys (requires playerctl)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# clipboard history
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy && ydotool key 29:1 42:1 47:1 47:0 42:0 29:0

# Screenshot a monitor
bind = SHIFT, PRINT, exec, hyprshot -m output --clipboard-only
# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only

windowrule = suppress_event maximize, match:class .*
windowrule = no_initial_focus 1, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

workspace = 4, border:false, rounding:false
